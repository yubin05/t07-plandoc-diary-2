<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>플랜두씨 다이어리</title>
<style>
  :root{
    --bg:#fafafa; --surface:#ffffff; --text:#1a1a1a; --muted:#4b4b4b;
    --accent:#0b5fff; --accent-contrast:#ffffff; --border:#e2e2e2; --radius:14px;
    --ok:#0a7d33; --danger:#c81e1e; --warn:#b06a00;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
  }
  main{max-width:960px;margin:0 auto;padding:16px 20px 60px;}
  h1{font-size:clamp(1.3rem,3.2vw,1.7rem);margin:0 0 4px;}
  h2{font-size:1.05rem;margin:0 0 10px;}
  h3{font-size:0.95rem;margin:0 0 6px;}
  .banner{
    background:#fff3e0;border:1px solid #f0c98c;border-radius:10px;
    padding:10px 14px;font-size:0.85rem;font-weight:700;color:#7a4d00;margin-bottom:16px;
  }
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 18px;margin-bottom:16px;
  }
  label{display:block;font-size:0.82rem;font-weight:700;margin:8px 0 3px;}
  input,select,textarea{
    width:100%;font:inherit;padding:7px 9px;border:1px solid var(--border);border-radius:8px;
  }
  textarea{min-height:50px;resize:vertical;}
  .row{display:flex;gap:8px;flex-wrap:wrap;}
  .row > *{flex:1 1 140px;}
  button{
    font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);padding:7px 12px;
  }
  button.primary{background:var(--accent);color:var(--accent-contrast);border-color:var(--accent);}
  button.danger{color:var(--danger);border-color:var(--danger);}
  button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  button.small{padding:4px 9px;font-size:0.78rem;}
  .btn-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}

  .plan-item, .task-item{
    border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;
  }
  .plan-item.selected{border-color:var(--accent);background:#f0f5ff;}
  .plan-item h3{cursor:pointer;}
  .task-item.done{opacity:0.7;}
  .task-item.done h3{text-decoration:line-through;}
  .meta{font-size:0.78rem;color:var(--muted);}
  .tag{
    display:inline-block;background:#eef2f5;border-radius:999px;padding:1px 8px;font-size:0.72rem;margin-right:4px;
  }
  .history-list, .log-list{font-size:0.8rem;color:var(--muted);margin-top:6px;padding-left:14px;}

  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:10px;}
  .metric{
    background:#f3f6fb;border-radius:10px;padding:10px 12px;text-align:left;border:none;cursor:pointer;font:inherit;
  }
  .metric .num{font-size:1.5rem;font-weight:800;display:block;}
  .metric .label{font-size:0.78rem;color:var(--muted);}
  .metric:hover{background:#e4ecfb;}

  .msg{font-size:0.85rem;margin-top:6px;min-height:1.1em;}
  .msg.ok{color:var(--ok);font-weight:700;}
  .msg.error{color:var(--danger);font-weight:700;}
  .sort-label{font-size:0.8rem;color:var(--muted);margin:4px 0;}
  .empty{color:var(--muted);font-size:0.85rem;}
</style>
</head>
<body>
<main>
  <h1>플랜두씨 다이어리</h1>
  <div class="banner">지금은 로그인이 없어 링크를 아는 사람은 누구나 볼 수 있습니다. 남이 봐도 괜찮은 내용만 넣으세요.</div>

  <!-- ===== 계획 ===== -->
  <section class="card">
    <h2>1. 계획</h2>
    <div id="reflection-suggest" class="msg"></div>
    <form id="form-plan">
      <div class="row">
        <div><label for="p-title">제목</label><input id="p-title" required></div>
        <div><label for="p-priority">우선순위</label>
          <select id="p-priority"><option value="high">높음</option><option value="medium" selected>보통</option><option value="low">낮음</option></select>
        </div>
      </div>
      <div class="row">
        <div><label for="p-start">시작일</label><input id="p-start" type="date" required></div>
        <div><label for="p-end">종료일</label><input id="p-end" type="date" required></div>
        <div><label for="p-hours">예상 시간(시간)</label><input id="p-hours" type="number" min="0" step="0.5" required></div>
      </div>
      <label for="p-criteria">성공 기준</label>
      <textarea id="p-criteria" required placeholder="무엇이 되면 이 계획을 성공으로 볼지"></textarea>
      <div class="btn-row"><button type="submit" class="primary">계획 만들기</button></div>
      <p class="msg" id="plan-msg"></p>
    </form>
    <h3 style="margin-top:16px;">내 계획 목록</h3>
    <div id="plan-list"><p class="empty">아직 계획이 없습니다.</p></div>
  </section>

  <!-- ===== 할 일 ===== -->
  <section class="card">
    <h2>2. 할 일 (<span id="selected-plan-title">계획을 먼저 선택하세요</span>)</h2>
    <form id="form-task">
      <div class="row">
        <div><label for="t-title">할 일</label><input id="t-title" required></div>
        <div><label for="t-due">마감일</label><input id="t-due" type="date"></div>
      </div>
      <div class="row">
        <div><label for="t-priority">우선순위</label>
          <select id="t-priority"><option value="high">높음</option><option value="medium" selected>보통</option><option value="low">낮음</option></select>
        </div>
        <div><label for="t-tags">태그(쉼표로 구분)</label><input id="t-tags" placeholder="예: 공부, 급함"></div>
        <div><label for="t-hours">예상 시간(시간)</label><input id="t-hours" type="number" min="0" step="0.5" value="1"></div>
      </div>
      <div class="btn-row"><button type="submit" class="primary">할 일 추가</button></div>
      <p class="msg" id="task-msg"></p>
    </form>

    <div class="row" style="margin-top:12px;">
      <div><label for="t-search">검색</label><input id="t-search" placeholder="제목으로 검색"></div>
      <div><label for="t-filter-status">상태</label>
        <select id="t-filter-status"><option value="">전체</option><option value="in_progress">진행 중</option><option value="done">완료</option></select>
      </div>
      <div><label for="t-sort">정렬</label>
        <select id="t-sort">
          <option value="due_date_asc">마감일 빠른 순</option>
          <option value="due_date_desc">마감일 늦은 순</option>
          <option value="priority">우선순위(높음→낮음)</option>
          <option value="created_desc">최근 추가 순</option>
        </select>
      </div>
    </div>
    <p class="sort-label" id="sort-label">정렬 기준: 마감일 빠른 순 (같은 마감일이면 만든 순서)</p>
    <p class="sort-label" id="active-filter-note"></p>

    <div id="task-list"><p class="empty">할 일이 없습니다.</p></div>
  </section>

  <!-- ===== 돌아보기 ===== -->
  <section class="card" id="review-section">
    <h2>3. 돌아보기</h2>
    <div class="metrics" id="metrics"></div>
    <p class="meta">예상 시간 합계 <span id="m-estimated">0</span>h · 실제 시간 합계 <span id="m-actual">0</span>h · 차이(실제−예상) <span id="m-diff">0</span>h</p>
    <label for="reflection-note">이번 돌아보기에서 다음 계획으로 넘길 고칠 점 한 줄</label>
    <div class="row">
      <input id="reflection-note" placeholder="예: 예상 시간을 20% 더 여유있게 잡기">
      <button type="button" id="btn-save-reflection" class="primary" style="flex:0 0 auto;">저장</button>
    </div>
    <p class="msg" id="reflection-msg"></p>
  </section>

  <section class="card">
    <h2>4. 내보내기</h2>
    <button type="button" id="btn-export">내 자료 전체를 파일로 내보내기</button>
  </section>
</main>

<script>
(function(){
  "use strict";

  var state = { plans: [], selectedPlanId: null, tasks: [], extraFilter: null, editingPlanId: null, editingTaskId: null }; // extraFilter: null | 'overdue' | 'blocked'

  function el(tag, opts){
    var e = document.createElement(tag);
    opts = opts || {};
    if(opts.text != null) e.textContent = opts.text;
    if(opts.className) e.className = opts.className;
    if(opts.attrs) for(var k in opts.attrs) e.setAttribute(k, opts.attrs[k]);
    return e;
  }
  function clearChildren(node){ while(node.firstChild) node.removeChild(node.firstChild); }
  function fmtDate(iso){
    if(!iso) return "-";
    if(iso.length <= 10) return iso; // 날짜만 있는 값(YYYY-MM-DD)은 그대로
    var d = new Date(iso);
    if(isNaN(d.getTime())) return iso;
    var f = new Intl.DateTimeFormat("ko-KR", { timeZone: "Asia/Seoul", year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false });
    return f.format(d) + " KST";
  }

  async function api(path, opts){
    var res = await fetch(path, opts);
    var data = await res.json().catch(function(){ return {}; });
    if(!res.ok) throw new Error(data.error || ("요청 실패 (" + res.status + ")"));
    return data;
  }

  // ---------------- 계획 ----------------

  async function loadPlans(){
    var data = await api("/api/plans");
    state.plans = data.plans;
    renderPlans();
    if(!state.selectedPlanId && state.plans.length > 0){
      selectPlan(state.plans[0].id);
    }else if(state.selectedPlanId){
      renderSelectedPlanTitle();
      await loadTasks();
      await loadReview();
    }
  }

  function renderPlans(){
    var list = document.getElementById("plan-list");
    clearChildren(list);
    if(state.plans.length === 0){
      list.appendChild(el("p", { className: "empty", text: "아직 계획이 없습니다." }));
      return;
    }
    state.plans.forEach(function(p){
      var item = el("div", { className: "plan-item" + (p.id === state.selectedPlanId ? " selected" : "") });

      if(state.editingPlanId === p.id){
        item.appendChild(buildPlanEditForm(p));
        list.appendChild(item);
        return;
      }

      var h3 = el("h3", { text: p.title + " " });
      h3.addEventListener("click", function(){ selectPlan(p.id); });
      var badge = el("span", { className: "tag", text: p.priority });
      h3.appendChild(badge);
      item.appendChild(h3);
      item.appendChild(el("div", { className: "meta", text: p.period_start + " ~ " + p.period_end + " · 예상 " + p.estimated_hours + "h" }));
      item.appendChild(el("div", { className: "meta", text: "성공 기준: " + p.success_criteria }));

      var btnRow = el("div", { className: "btn-row" });
      var editBtn = el("button", { className: "small", text: "수정" });
      editBtn.addEventListener("click", function(){ state.editingPlanId = p.id; renderPlans(); });
      var histBtn = el("button", { className: "small", text: "수정 이력 보기" });
      var histBox = el("div", { className: "history-list" });
      histBtn.addEventListener("click", async function(){
        if(histBox.getAttribute("data-open") === "1"){
          clearChildren(histBox); histBox.setAttribute("data-open", "0"); return;
        }
        var h = await api("/api/plans/" + p.id + "/history");
        clearChildren(histBox);
        if(h.history.length === 0){
          histBox.appendChild(el("div", { text: "아직 수정한 적 없습니다." }));
        }else{
          h.history.forEach(function(row){
            histBox.appendChild(el("div", { text: "[" + fmtDate(row.snapshot_at) + "] " + row.title + " / " + row.period_start + "~" + row.period_end + " / 우선순위 " + row.priority + " / 예상 " + row.estimated_hours + "h / 성공기준: " + row.success_criteria }));
          });
        }
        histBox.setAttribute("data-open", "1");
      });
      btnRow.appendChild(editBtn);
      btnRow.appendChild(histBtn);
      item.appendChild(btnRow);
      item.appendChild(histBox);

      list.appendChild(item);
    });
  }

  function buildPlanEditForm(p){
    var form = el("form");
    var titleInput = el("input", { attrs: { value: p.title, required: "required" } });
    var startInput = el("input", { attrs: { type: "date", value: p.period_start, required: "required" } });
    var endInput = el("input", { attrs: { type: "date", value: p.period_end, required: "required" } });
    var prioritySelect = el("select");
    ["high","medium","low"].forEach(function(v){
      var opt = el("option", { text: v === "high" ? "높음" : (v === "medium" ? "보통" : "낮음"), attrs: { value: v } });
      if(v === p.priority) opt.selected = true;
      prioritySelect.appendChild(opt);
    });
    var criteriaInput = el("textarea", { text: p.success_criteria });
    var hoursInput = el("input", { attrs: { type: "number", min: "0", step: "0.5", value: p.estimated_hours, required: "required" } });

    [
      ["제목", titleInput], ["시작일", startInput], ["종료일", endInput],
      ["우선순위", prioritySelect], ["성공 기준", criteriaInput], ["예상 시간(시간)", hoursInput]
    ].forEach(function(pair){
      form.appendChild(el("label", { text: pair[0] }));
      form.appendChild(pair[1]);
    });

    var btnRow = el("div", { className: "btn-row" });
    var saveBtn = el("button", { className: "small primary", text: "저장", attrs: { type: "submit" } });
    var cancelBtn = el("button", { className: "small", text: "취소", attrs: { type: "button" } });
    cancelBtn.addEventListener("click", function(){ state.editingPlanId = null; renderPlans(); });
    btnRow.appendChild(saveBtn);
    btnRow.appendChild(cancelBtn);
    form.appendChild(btnRow);

    form.addEventListener("submit", async function(e){
      e.preventDefault();
      await api("/api/plans/" + p.id, {
        method: "PUT", headers: { "content-type": "application/json" },
        body: JSON.stringify({
          title: titleInput.value.trim(),
          period_start: startInput.value,
          period_end: endInput.value,
          priority: prioritySelect.value,
          success_criteria: criteriaInput.value.trim(),
          estimated_hours: hoursInput.value
        })
      });
      state.editingPlanId = null;
      await loadPlans();
    });
    return form;
  }

  function renderSelectedPlanTitle(){
    var plan = state.plans.find(function(p){ return p.id === state.selectedPlanId; });
    document.getElementById("selected-plan-title").textContent = plan ? plan.title : "계획을 먼저 선택하세요";
  }

  function selectPlan(id){
    state.selectedPlanId = id;
    renderPlans();
    renderSelectedPlanTitle();
    loadTasks();
    loadReview();
  }

  document.getElementById("form-plan").addEventListener("submit", async function(e){
    e.preventDefault();
    var msg = document.getElementById("plan-msg");
    try{
      var body = {
        title: document.getElementById("p-title").value.trim(),
        period_start: document.getElementById("p-start").value,
        period_end: document.getElementById("p-end").value,
        priority: document.getElementById("p-priority").value,
        success_criteria: document.getElementById("p-criteria").value.trim(),
        estimated_hours: document.getElementById("p-hours").value
      };
      if(window.__suggestedReflectionId){ body.source_reflection_id = window.__suggestedReflectionId; }
      var res = await api("/api/plans", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
      msg.textContent = "계획을 저장했습니다.";
      msg.className = "msg ok";
      document.getElementById("form-plan").reset();
      window.__suggestedReflectionId = null;
      document.getElementById("reflection-suggest").textContent = "";
      await loadPlans();
      selectPlan(res.plan.id);
    }catch(err){
      msg.textContent = "저장 실패: " + err.message;
      msg.className = "msg error";
    }
  });

  // ---------------- 할 일 ----------------

  function currentTaskQuery(){
    var params = new URLSearchParams();
    if(state.selectedPlanId) params.set("plan_id", state.selectedPlanId);
    var q = document.getElementById("t-search").value.trim();
    if(q) params.set("q", q);
    var status = document.getElementById("t-filter-status").value;
    if(status) params.set("status", status);
    if(state.extraFilter === "overdue") params.set("overdue", "true");
    if(state.extraFilter === "blocked") params.set("blocked", "true");
    var sort = document.getElementById("t-sort").value;
    params.set("sort", sort);
    return params;
  }

  var SORT_LABELS = {
    due_date_asc: "정렬 기준: 마감일 빠른 순 (같은 마감일이면 만든 순서)",
    due_date_desc: "정렬 기준: 마감일 늦은 순 (같은 마감일이면 만든 순서)",
    priority: "정렬 기준: 우선순위(높음→낮음), 같으면 마감일 빠른 순",
    created_desc: "정렬 기준: 최근에 추가한 순"
  };

  async function loadTasks(applyFilter){
    if(!state.selectedPlanId){ state.tasks = []; renderTasks(); return; }
    var params = currentTaskQuery();
    if(applyFilter) applyFilterToControls(applyFilter);
    var data = await api("/api/tasks?" + params.toString());
    state.tasks = data.tasks;
    document.getElementById("sort-label").textContent = SORT_LABELS[data.sort_applied] || "";
    renderTasks();
  }
  function applyFilterToControls(f){
    if(f.status !== undefined) document.getElementById("t-filter-status").value = f.status;
    if(f.q !== undefined) document.getElementById("t-search").value = f.q;
  }

  ["input","change"].forEach(function(evt){
    document.getElementById("t-search").addEventListener(evt, debounce(function(){ loadTasks(); }, 250));
    document.getElementById("t-filter-status").addEventListener(evt, function(){ state.extraFilter = null; renderActiveFilterNote(); loadTasks(); });
    document.getElementById("t-sort").addEventListener(evt, function(){ loadTasks(); });
  });

  function renderActiveFilterNote(){
    var box = document.getElementById("active-filter-note");
    if(!box) return;
    if(state.extraFilter === "overdue"){ box.textContent = "지금 \"지연\" 목록만 보고 있습니다."; }
    else if(state.extraFilter === "blocked"){ box.textContent = "지금 \"막힘\" 목록만 보고 있습니다."; }
    else{ box.textContent = ""; }
  }
  function debounce(fn, ms){ var t; return function(){ clearTimeout(t); var a=arguments; t=setTimeout(function(){ fn.apply(null,a); }, ms); }; }

  function renderTasks(){
    var list = document.getElementById("task-list");
    clearChildren(list);
    if(state.tasks.length === 0){
      list.appendChild(el("p", { className: "empty", text: "할 일이 없습니다." }));
      return;
    }
    state.tasks.forEach(function(t){
      var item = el("div", { className: "task-item" + (t.status === "done" ? " done" : "") });

      if(state.editingTaskId === t.id){
        item.appendChild(buildTaskEditForm(t));
        list.appendChild(item);
        return;
      }

      var h3 = el("h3", { text: t.title });
      item.appendChild(h3);

      var tags;
      try{ tags = JSON.parse(t.tags || "[]"); }catch(e){ tags = []; }
      var metaLine = el("div", { className: "meta" });
      metaLine.appendChild(document.createTextNode(
        "마감 " + (t.due_date || "-") + " · 우선순위 " + t.priority + " · 예상 " + t.estimated_hours + "h" + " · "
      ));
      tags.forEach(function(tag){ metaLine.appendChild(el("span", { className: "tag", text: tag })); });
      item.appendChild(metaLine);

      // 실행 기록은 항상 펼쳐서 보여준다 (클릭해야만 보이는 방식 X)
      var logs = [];
      try{ logs = JSON.parse(t.logs_json || "[]") || []; }catch(e){ logs = []; }
      var logListBox = el("div", { className: "log-list" });
      if(logs.length === 0){
        logListBox.appendChild(el("div", { text: "실행 기록 없음" }));
      }else{
        logs.forEach(function(l){
          var line = fmtDate(l.started_at) + " ~ " + fmtDate(l.ended_at) + " (" + Math.round(l.actual_minutes) + "분)" + (l.blocked_reason ? " · 막힘: " + l.blocked_reason : "");
          logListBox.appendChild(el("div", { text: line }));
        });
      }
      item.appendChild(logListBox);

      var btnRow = el("div", { className: "btn-row" });
      if(t.status === "done"){
        var reopenBtn = el("button", { className: "small", text: "되돌리기" });
        reopenBtn.addEventListener("click", async function(){ await api("/api/tasks/" + t.id + "/reopen", { method: "POST" }); await loadTasks(); await loadReview(); });
        btnRow.appendChild(reopenBtn);
      }else{
        var doneBtn = el("button", { className: "small primary", text: "완료" });
        doneBtn.addEventListener("click", async function(){ await api("/api/tasks/" + t.id + "/complete", { method: "POST" }); await loadTasks(); await loadReview(); });
        btnRow.appendChild(doneBtn);
      }
      var editBtn = el("button", { className: "small", text: "수정" });
      editBtn.addEventListener("click", function(){ state.editingTaskId = t.id; renderTasks(); });
      var delBtn = el("button", { className: "small danger", text: "삭제" });
      delBtn.addEventListener("click", async function(){
        if(!window.confirm("이 할 일을 지울까요?")) return;
        await api("/api/tasks/" + t.id, { method: "DELETE" }); await loadTasks(); await loadReview();
      });
      var logBtn = el("button", { className: "small", text: "+ 실행 기록 추가" });
      var logFormBox = el("div");
      logBtn.addEventListener("click", function(){ toggleLogForm(t, logFormBox); });
      btnRow.appendChild(editBtn);
      btnRow.appendChild(delBtn);
      btnRow.appendChild(logBtn);
      item.appendChild(btnRow);
      item.appendChild(logFormBox);

      list.appendChild(item);
    });
  }

  function buildTaskEditForm(t){
    var tags;
    try{ tags = JSON.parse(t.tags || "[]"); }catch(e){ tags = []; }

    var form = el("form");
    var titleInput = el("input", { attrs: { value: t.title, required: "required" } });
    var dueInput = el("input", { attrs: { type: "date" } });
    if(t.due_date) dueInput.value = t.due_date;
    var prioritySelect = el("select");
    ["high","medium","low"].forEach(function(v){
      var opt = el("option", { text: v === "high" ? "높음" : (v === "medium" ? "보통" : "낮음"), attrs: { value: v } });
      if(v === t.priority) opt.selected = true;
      prioritySelect.appendChild(opt);
    });
    var tagsInput = el("input", { attrs: { value: tags.join(", ") } });
    var hoursInput = el("input", { attrs: { type: "number", min: "0", step: "0.5", value: t.estimated_hours } });

    [
      ["할 일", titleInput], ["마감일(비우면 없음)", dueInput],
      ["우선순위", prioritySelect], ["태그(쉼표로 구분)", tagsInput], ["예상 시간(시간)", hoursInput]
    ].forEach(function(pair){
      form.appendChild(el("label", { text: pair[0] }));
      form.appendChild(pair[1]);
    });

    var btnRow = el("div", { className: "btn-row" });
    var saveBtn = el("button", { className: "small primary", text: "저장", attrs: { type: "submit" } });
    var cancelBtn = el("button", { className: "small", text: "취소", attrs: { type: "button" } });
    cancelBtn.addEventListener("click", function(){ state.editingTaskId = null; renderTasks(); });
    btnRow.appendChild(saveBtn);
    btnRow.appendChild(cancelBtn);
    form.appendChild(btnRow);

    form.addEventListener("submit", async function(e){
      e.preventDefault();
      await api("/api/tasks/" + t.id, {
        method: "PUT", headers: { "content-type": "application/json" },
        body: JSON.stringify({
          title: titleInput.value.trim(),
          due_date: dueInput.value || null,
          priority: prioritySelect.value,
          tags: tagsInput.value,
          estimated_hours: hoursInput.value
        })
      });
      state.editingTaskId = null;
      await loadTasks();
    });
    return form;
  }

  function toggleLogForm(task, box){
    if(box.getAttribute("data-open") === "1"){ clearChildren(box); box.setAttribute("data-open", "0"); return; }
    box.setAttribute("data-open", "1");
    clearChildren(box);
    var form = el("form");
    var startInput = el("input", { attrs: { type: "datetime-local", required: "required" } });
    var endInput = el("input", { attrs: { type: "datetime-local", required: "required" } });
    var reasonInput = el("input", { attrs: { placeholder: "막혔던 이유(없으면 비우기)" } });
    var saveBtn = el("button", { className: "small primary", text: "실행 기록 저장", attrs: { type: "submit" } });
    [startInput, endInput, reasonInput, saveBtn].forEach(function(x){
      x.style.marginBottom = "4px"; form.appendChild(x);
    });
    form.addEventListener("submit", async function(e){
      e.preventDefault();
      await api("/api/tasks/" + task.id + "/logs", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ started_at: new Date(startInput.value).toISOString(), ended_at: new Date(endInput.value).toISOString(), blocked_reason: reasonInput.value || null })
      });
      box.setAttribute("data-open", "0");
      await loadTasks(); // 목록을 다시 불러오면 방금 추가한 기록이 항상-펼침 목록에 바로 보인다
      await loadReview();
    });
    box.appendChild(form);
  }

  document.getElementById("form-task").addEventListener("submit", async function(e){
    e.preventDefault();
    var msg = document.getElementById("task-msg");
    if(!state.selectedPlanId){ msg.textContent = "먼저 계획을 선택하세요."; msg.className = "msg error"; return; }
    try{
      await api("/api/tasks", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({
          plan_id: state.selectedPlanId,
          title: document.getElementById("t-title").value.trim(),
          due_date: document.getElementById("t-due").value || null,
          priority: document.getElementById("t-priority").value,
          tags: document.getElementById("t-tags").value,
          estimated_hours: document.getElementById("t-hours").value
        })
      });
      msg.textContent = "할 일을 추가했습니다."; msg.className = "msg ok";
      document.getElementById("form-task").reset();
      document.getElementById("t-hours").value = "1";
      await loadTasks();
      await loadReview();
    }catch(err){
      msg.textContent = "추가 실패: " + err.message; msg.className = "msg error";
    }
  });

  // ---------------- 돌아보기 ----------------

  async function loadReview(){
    if(!state.selectedPlanId){ renderReview(null); return; }
    var data = await api("/api/review?plan_id=" + encodeURIComponent(state.selectedPlanId));
    renderReview(data);
  }

  function renderReview(data){
    var box = document.getElementById("metrics");
    clearChildren(box);
    if(!data){
      box.appendChild(el("p", { className: "empty", text: "계획을 선택하면 돌아보기가 표시됩니다." }));
      document.getElementById("m-estimated").textContent = "0";
      document.getElementById("m-actual").textContent = "0";
      document.getElementById("m-diff").textContent = "0";
      return;
    }
    var metrics = [
      { num: data.planned_count, label: "계획 수", status: "", extra: null },
      { num: data.done_count, label: "완료 수", status: "done", extra: null },
      { num: data.overdue_count, label: "지연 수", status: "", extra: "overdue" },
      { num: data.blocked_count, label: "막힘 수", status: "", extra: "blocked" }
    ];
    metrics.forEach(function(m){
      var btn = el("button", { className: "metric" });
      btn.appendChild(el("span", { className: "num", text: String(m.num) }));
      btn.appendChild(el("span", { className: "label", text: m.label }));
      btn.addEventListener("click", function(){
        document.getElementById("t-filter-status").value = m.status;
        state.extraFilter = m.extra;
        renderActiveFilterNote();
        loadTasks();
        document.getElementById("task-list").scrollIntoView({ behavior: "smooth", block: "start" });
      });
      box.appendChild(btn);
    });
    document.getElementById("m-estimated").textContent = data.estimated_hours_sum;
    document.getElementById("m-actual").textContent = data.actual_hours_sum;
    document.getElementById("m-diff").textContent = data.diff_hours;
  }

  document.getElementById("btn-save-reflection").addEventListener("click", async function(){
    var msg = document.getElementById("reflection-msg");
    var note = document.getElementById("reflection-note").value.trim();
    if(!state.selectedPlanId){ msg.textContent = "먼저 계획을 선택하세요."; msg.className = "msg error"; return; }
    if(!note){ msg.textContent = "내용을 입력하세요."; msg.className = "msg error"; return; }
    try{
      await api("/api/reflections", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ plan_id: state.selectedPlanId, note: note }) });
      msg.textContent = "저장했습니다. 다음 계획을 만들 때 위쪽에 제안으로 나타납니다.";
      msg.className = "msg ok";
      document.getElementById("reflection-note").value = "";
      checkSuggestedReflection();
    }catch(err){
      msg.textContent = "저장 실패: " + err.message; msg.className = "msg error";
    }
  });

  async function checkSuggestedReflection(){
    var data = await api("/api/reflections/latest-unused");
    var box = document.getElementById("reflection-suggest");
    if(data.reflection){
      window.__suggestedReflectionId = data.reflection.id;
      box.textContent = "이전 돌아보기 메모: \"" + data.reflection.note + "\" — 이 계획에 반영해서 만들어집니다.";
    }else{
      window.__suggestedReflectionId = null;
      box.textContent = "";
    }
  }

  // ---------------- 내보내기 ----------------

  document.getElementById("btn-export").addEventListener("click", function(){
    window.location.href = "/api/export";
  });

  // ---------------- 초기화 ----------------

  loadPlans();
  checkSuggestedReflection();
})();
</script>
</body>
</html>
